<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores Para Ti 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Estrellitas del fondo -->
    <div class="estrellas"></div>

    <!-- TÍTULO -->
    <header class="encabezado">
        <h1>Flores</h1>
        <h2>Para Ti 🌻</h2>
    </header>


    <!-- REPRODUCTOR -->
    <div class="musica">

        <button id="botonMusica">▶</button>

        <div class="infoMusica">
            <div class="tituloMusica">
                Feliz 21 de septiembre 💗
            </div>

            <div class="barra">
                <div id="progreso"></div>
            </div>

            <div class="tiempo">
                <span id="actual">0:00</span>
                <span id="duracion">0:00</span>
            </div>
        </div>

    </div>

    <audio id="cancion">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>


    <!-- JARDÍN -->
    <main class="jardin">

        <div class="flor flor1"></div>
        <div class="flor flor2"></div>
        <div class="flor flor3"></div>
        <div class="flor flor4"></div>
        <div class="flor flor5"></div>
        <div class="flor flor6"></div>
        <div class="flor flor7"></div>

    </main>


    <div class="mensaje">
        Para alguien muy especial 💛
    </div>


    <script src="script.js"></script>

</body>
</html>
